<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" role="img" aria-label="Of 97 two-finger taps, macOS sent 62 right clicks and dropped 35"><title>Of 97 two-finger taps, macOS sent 62 right clicks and dropped 35</title><style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#383835;--s1:#3987e5;--s2:#d95926;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.t{font-size:17px;font-weight:600}.s{font-size:13px;fill:var(--ink2)}.a{font-size:12px;fill:var(--ink2)}.v{font-size:13px;font-weight:600}
.g{stroke:var(--grid);stroke-width:1}
</style><rect width="760" height="170" rx="8" fill="var(--bg)"/><text x="24" y="34" class="t">…and drops 1 in 3 when you tap fast</text><text x="24" y="54" class="s">97 two-finger taps seen on the trackpad vs right clicks macOS actually sent</text><rect x="24" y="76" width="454.1" height="34" rx="4" fill="var(--s1)"/><rect x="480.1" y="76" width="255.9" height="34" rx="4" fill="var(--s2)"/><text x="24" y="132" class="v">62 delivered (64 %)</text><text x="736" y="132" class="v" text-anchor="end">35 dropped (36 %)</text><rect x="24" y="148" width="12" height="12" rx="3" fill="var(--s1)"/><text x="42" y="158" class="a">right click sent</text><rect x="160" y="148" width="12" height="12" rx="3" fill="var(--s2)"/><text x="178" y="158" class="a">tap swallowed by macOS</text></svg>