<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Click duration: two-finger tap 0.15–0.47 ms, one-finger tap 1–5 ms, physical click 280–345 ms"><title>Click duration: two-finger tap 0.15–0.47 ms, one-finger tap 1–5 ms, physical click 280–345 ms</title><style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#383835;--s1:#3987e5;--s2:#d95926;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.t{font-size:17px;font-weight:600}.s{font-size:13px;fill:var(--ink2)}.a{font-size:12px;fill:var(--ink2)}.v{font-size:13px;font-weight:600}
.g{stroke:var(--grid);stroke-width:1}
</style><rect width="760" height="250" rx="8" fill="var(--bg)"/><text x="24" y="34" class="t">How long each click lasts</text><text x="24" y="54" class="s">mouse-down → mouse-up, measured with a CGEventTap (log scale)</text><line x1="200.0" y1="78" x2="200.0" y2="208" class="g"/><text x="200.0" y="228" class="a" text-anchor="middle">0.1 ms</text><line x1="330.0" y1="78" x2="330.0" y2="208" class="g"/><text x="330.0" y="228" class="a" text-anchor="middle">1 ms</text><line x1="460.0" y1="78" x2="460.0" y2="208" class="g"/><text x="460.0" y="228" class="a" text-anchor="middle">10 ms</text><line x1="590.0" y1="78" x2="590.0" y2="208" class="g"/><text x="590.0" y="228" class="a" text-anchor="middle">100 ms</text><line x1="720.0" y1="78" x2="720.0" y2="208" class="g"/><text x="720.0" y="228" class="a" text-anchor="middle">1 s</text><text x="24" y="101" class="v">Two-finger tap</text><text x="24" y="117" class="a">right click — game misses it</text><rect x="222.9" y="93" width="64.5" height="14" rx="4" fill="var(--s2)"/><text x="297.4" y="104" class="a">0.15–0.47 ms</text><text x="24" y="141" class="v">One-finger tap</text><text x="24" y="157" class="a">left click — game sees it</text><rect x="330.0" y="133" width="90.9" height="14" rx="4" fill="var(--s1)"/><text x="430.9" y="144" class="a">1–5 ms</text><text x="24" y="181" class="v">Physical click</text><text x="24" y="197" class="a">two fingers — game sees it</text><rect x="648.1" y="173" width="11.8" height="14" rx="4" fill="var(--s1)"/><text x="669.9" y="184" class="a">280–345 ms</text></svg>